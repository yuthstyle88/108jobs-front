[request_definition]
r = sub, obj, act  # คำขอประกอบด้วย (subject, object, action)

[policy_definition]
p = sub, obj, act  # Policy: กำหนดว่าใครสามารถทำอะไรที่ใด

[role_definition]
g = _, _           # ความสัมพันธ์ระหว่าง Role และ Subject (Role-Based Access Control)

[policy_effect]
e = some(where (p.eft == allow))  # ผลลัพธ์: อนุญาตเมื่อใดที่ policy ให้ผ่าน

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act