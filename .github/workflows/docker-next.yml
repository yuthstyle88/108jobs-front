name: Build & Push Next.js to GHCR

on:
  push:
    branches: ["prod", "dev"]   # ตอนนี้จะ build ทั้ง dev/prod
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/yuthstyle88/108jobs-front
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}   # ใช้ PAT ที่มี write:packages

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.BRANCH }}
            ${{ env.IMAGE }}:${{ env.BRANCH }}-${{ env.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max