name: Build & Push Next.js to GHCR

on:
  push:
    branches: ["prod", "dev"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      SHA_SHORT: ${{ github.sha.substr(0,7) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH }}
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH }}-${{ env.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max