name: Build & Deploy Next.js App

on:
  push:
    branches: ["prod", "dev"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Current branch name (prod/dev)
      BRANCH: ${{ github.ref_name }}
      # Application path on remote server
      APP_PATH: /var/www/apps/fast-work-clone${{ github.ref_name == 'prod' && '' || '-dev' }}
      # Service name for PM2 or systemd
      SERVICE_NAME: fast-work-clone${{ github.ref_name == 'prod' && '' || '-dev' }}
      REPO: ${{ github.repository }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🗝️ Add SSH host key to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: 🚀 Deploy Next.js app on remote server
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s -- "${{ env.BRANCH }}" "${{ env.APP_PATH }}" "${{ env.SERVICE_NAME }}" "${{ env.REPO }}" <<'REMOTE'
          set -euo pipefail
          BRANCH="$1"
          APP_PATH="$2"
          SERVICE_NAME="$3"
          REPO="$4"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "Deploying branch=${BRANCH} to app path=${APP_PATH} with service=${SERVICE_NAME}"

          if [ ! -d "$APP_PATH" ]; then
            echo "Cloning repository into $APP_PATH"
            git clone --branch "$BRANCH" "git@github.com:${REPO}.git" "$APP_PATH"
          fi

          cd "$APP_PATH"
          git remote set-url origin "git@github.com:${REPO}.git" || true
          echo "Fetching latest changes"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          echo "Installing dependencies"
          npm ci

          echo "Building Next.js app"
          npm run build

          echo "Restarting service $SERVICE_NAME"
          if command -v pm2 >/dev/null 2>&1; then
            pm2 restart "$SERVICE_NAME" || pm2 start npm --name "$SERVICE_NAME" -- start
          else
            systemctl restart "$SERVICE_NAME" || echo "Service $SERVICE_NAME not found or failed to restart"
          fi
          REMOTE
