services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://host.docker.internal:8532
      API_INTERNAL_URL: http://host.docker.internal:8532
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"